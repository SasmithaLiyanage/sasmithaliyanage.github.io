<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="login.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
    />
  </head>
  <body>
    <div class="main">
      <div class="container">
        <div class="image"></div>
        <div class="detail">
          <div class="logo">
            <p>Data Analizer</p>
          </div>
          <div class="form">
            <form action="" method="post">
              <div class="form-input">
                <input
                  type="text"
                  ,
                  name="username"
                  ,
                  placeholder="User name"
                />
                <i class="ri-user-3-fill"></i>
              </div>

              <div class="form-input">
                <input
                  type="password"
                  ,
                  name="password"
                  ,
                  placeholder="Password"
                />
                <i class="ri-lock-2-fill"></i>
              </div>
              <button type="submit" class="botton">Login</button>
            </form>

            <div class="demo">
                <a href="main.html">Did't have account</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
